# DHCP server configuration

interface: veth-dhcp

subnet: "10.0.2.0"
subnet_mask: "255.255.255.0"

server_ip: "10.0.2.254"
gateway: "10.0.2.254"
dns: "8.8.8.8"

# lease duration in seconds
lease_time: 3600

# static reservations — these IPs are locked to a specific MAC, never offered to other clients
# note: network address, broadcast, server IP and router are always reserved automatically
reservations: []
